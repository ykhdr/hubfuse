name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.7"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: make build

      - name: Build binaries
        run: |
          go build -o hubfuse-hub ./cmd/hubfuse-hub/
          go build -o hubfuse ./cmd/hubfuse/

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            hubfuse-hub
            hubfuse
          retention-days: 7

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: make vet

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Its own job, not folded into Vet or Lint, so a security finding is never
      # read as a style failure.
      #
      # It earns the slot on measured grounds, not principle. On 2026-09-05 it
      # reported three advisories against golang.org/x/crypto as reachable — two
      # of them DoS on ssh.NewServerConn, the path every incoming SSHFS
      # connection takes on a port the agent exposes to the LAN — while the
      # Dependabot alert list showed none for that module (they are Go-vulndb
      # GO-2026-* entries, not GHSA) and the Dependabot PR that did exist
      # targeted a version that fixed only the one advisory that did NOT apply
      # to us. Three mechanisms, three answers; this is the one that was right.
      #
      # It is also the only one that answers the question that matters — is the
      # vulnerable code reachable from ours — which is what let #107 rule out
      # GO-2026-6303 with a reason instead of bumping and hoping.
      #
      # Blocking, deliberately: #89 and #107 both existed because nothing was
      # watching. The cost is that an upstream advisory with no fix released can
      # redden a PR that changed nothing. When that happens the answer is to fix
      # the exposure or record why it does not apply — not to make this job
      # advisory. govulncheck already exits 0 for a module-level advisory in code
      # we never call, which is the common shape of an unfixable one: GO-2026-5932
      # (x/crypto/openpgp, unmaintained, no fix version) sits in the tree today
      # and does not fail this job.
      - name: Run govulncheck
        run: make vulncheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: make test-unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: make test-integration

  test-cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run CLI tests
        run: make test-cli

  test-scenarios:
    name: Scenario Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run scenario tests
        run: make test-scenarios

  proto-check:
    name: Proto Staleness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.2"
          # Without a token the action resolves the protoc download through the
          # GitHub API unauthenticated, and the rate limit for that is per source
          # IP — which Actions runners share. It then fails the job with
          # "unable to get latest version" before running any of our code, so a
          # busy hour or a GitHub incident turns this into a red pipeline that
          # says nothing about the commit. The token raises the limit to the
          # per-repository one.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.33.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0

      - name: Regenerate proto
        run: make proto-gen

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Generated proto files are out of date. Run 'make proto-gen' and commit the result."
            git diff --stat
            git diff
            exit 1
          fi
